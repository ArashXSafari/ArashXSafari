<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Arash Safari — Search, Ranking and Decision Systems</title>
  <desc id="desc">Minimal animated profile banner for search, ranking and decision systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f17"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="58" y="82" fill="#94a3b8" font-size="16" letter-spacing="6">ARASH SAFARI</text>
    <text x="58" y="145" fill="#f8fafc" font-size="46" font-weight="700">Machine Learning Engineer</text>
    <text x="58" y="192" fill="#cbd5e1" font-size="27">Search · Ranking · Decision Systems</text>
  </g>

  <g transform="translate(58 240)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="url(#line)" stroke-width="2"/>
    <circle cx="120" cy="0" r="5" fill="#64748b"/>
    <circle cx="520" cy="0" r="5" fill="#64748b"/>
    <circle cx="920" cy="0" r="5" fill="#64748b"/>
    <text x="95" y="30" fill="#64748b">SEARCH</text>
    <text x="493" y="30" fill="#64748b">RANK</text>
    <text x="885" y="30" fill="#64748b">DECIDE</text>
    <circle r="6" fill="#60a5fa" filter="url(#glow)">
      <animate attributeName="cx" values="120;520;920;120" keyTimes="0;.42;.84;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;1;1;.55" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>