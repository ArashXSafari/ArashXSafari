<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="Selected projects and system architecture showcase">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b14"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#0c2d28"/><stop offset="1" stop-color="#0b1822"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1b1635"/><stop offset="1" stop-color="#0b1822"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#0f2139"/><stop offset="1" stop-color="#0b1822"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="660" rx="22" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="52" y="58" fill="#f8fafc" font-size="28" font-weight="750">Selected systems</text>
    <text x="52" y="88" fill="#7f91a5" font-size="16">Independent work, production systems, and the way I think about engineering.</text>

    <g transform="translate(52 125)">
      <rect width="335" height="230" rx="18" fill="url(#p1)" stroke="#1f594a"/>
      <text x="24" y="42" fill="#86efac" font-size="14" font-weight="700" letter-spacing="2">GEOSPATIAL</text>
      <text x="24" y="78" fill="#f8fafc" font-size="29" font-weight="750">Neshaneh</text>
      <text x="24" y="108" fill="#a9bac9" font-size="15">Official maps → georeferencing →</text>
      <text x="24" y="132" fill="#a9bac9" font-size="15">topology checks → human review</text>
      <path d="M35 177 L80 146 L126 182 L170 153 L215 186 L286 147" fill="none" stroke="#34d399" stroke-width="4"/>
      <g fill="#34d399" filter="url(#glow)">
        <circle cx="35" cy="177" r="5"/><circle cx="126" cy="182" r="5"/><circle cx="215" cy="186" r="5"/>
      </g>
      <text x="24" y="214" fill="#6ee7b7" font-size="13">Python · GIS · FastAPI · React</text>
    </g>

    <g transform="translate(432 125)">
      <rect width="335" height="230" rx="18" fill="url(#p2)" stroke="#4c3e75"/>
      <text x="24" y="42" fill="#c4b5fd" font-size="14" font-weight="700" letter-spacing="2">DATA QUALITY</text>
      <text x="24" y="78" fill="#f8fafc" font-size="29" font-weight="750">Snowplow Validator</text>
      <text x="24" y="108" fill="#a9bac9" font-size="15">Contracts → automated execution →</text>
      <text x="24" y="132" fill="#a9bac9" font-size="15">findings → regression → audit</text>
      <g transform="translate(30 154)">
        <rect x="0" y="0" width="62" height="42" rx="8" fill="none" stroke="#a78bfa" stroke-width="2"/>
        <rect x="102" y="0" width="62" height="42" rx="8" fill="none" stroke="#a78bfa" stroke-width="2"/>
        <rect x="204" y="0" width="62" height="42" rx="8" fill="none" stroke="#a78bfa" stroke-width="2"/>
        <path d="M62 21H102 M164 21H204" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="0;-22" dur="1.7s" repeatCount="indefinite"/></path>
      </g>
      <text x="24" y="214" fill="#c4b5fd" font-size="13">FastAPI · Postgres · React · Playwright</text>
    </g>

    <g transform="translate(812 125)">
      <rect width="335" height="230" rx="18" fill="url(#p3)" stroke="#244a75"/>
      <text x="24" y="42" fill="#93c5fd" font-size="14" font-weight="700" letter-spacing="2">CONTROL SYSTEMS</text>
      <text x="24" y="78" fill="#f8fafc" font-size="29" font-weight="750">Satellite ADCS</text>
      <text x="24" y="108" fill="#a9bac9" font-size="15">Attitude determination &amp; control</text>
      <text x="24" y="132" fill="#a9bac9" font-size="15">simulation from aerospace background</text>
      <g transform="translate(55 148)">
        <circle cx="108" cy="30" r="18" fill="#94a3b8"/>
        <path d="M108 30L30 6L18 44Z" fill="#2563eb" opacity=".75"/>
        <path d="M108 30L186 6L198 44Z" fill="#2563eb" opacity=".75"/>
        <circle cx="108" cy="30" r="8" fill="#f8fafc"><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/></circle>
      </g>
      <text x="24" y="214" fill="#93c5fd" font-size="13">Python · Simulation · Control</text>
    </g>

    <text x="52" y="412" fill="#f8fafc" font-size="26" font-weight="750">How I build</text>
    <text x="52" y="441" fill="#7f91a5" font-size="15">The recurring pattern across my work is turning uncertain product problems into systems that can be measured, tested, and operated.</text>

    <g transform="translate(52 485)" text-anchor="middle">
      <g><rect width="176" height="100" rx="15" fill="#0b1824" stroke="#21415c"/><text x="88" y="38" fill="#60a5fa" font-size="17" font-weight="700">OBSERVE</text><text x="88" y="66" fill="#9fb0c0" font-size="13">events · state · context</text></g>
      <text x="205" y="58" fill="#38bdf8" font-size="30">→</text>
      <g transform="translate(232)"><rect width="176" height="100" rx="15" fill="#0b1824" stroke="#21415c"/><text x="88" y="38" fill="#60a5fa" font-size="17" font-weight="700">FORMULATE</text><text x="88" y="66" fill="#9fb0c0" font-size="13">objective · constraints</text></g>
      <text x="437" y="58" fill="#38bdf8" font-size="30">→</text>
      <g transform="translate(464)"><rect width="176" height="100" rx="15" fill="#0b1824" stroke="#21415c"/><text x="88" y="38" fill="#60a5fa" font-size="17" font-weight="700">BUILD</text><text x="88" y="66" fill="#9fb0c0" font-size="13">model · pipeline · service</text></g>
      <text x="669" y="58" fill="#38bdf8" font-size="30">→</text>
      <g transform="translate(696)"><rect width="176" height="100" rx="15" fill="#0b1824" stroke="#21415c"/><text x="88" y="38" fill="#60a5fa" font-size="17" font-weight="700">EXPERIMENT</text><text x="88" y="66" fill="#9fb0c0" font-size="13">integrity · effects · learn</text></g>
      <text x="901" y="58" fill="#38bdf8" font-size="30">→</text>
      <g transform="translate(928)"><rect width="176" height="100" rx="15" fill="#0b1824" stroke="#21415c"/><text x="88" y="38" fill="#60a5fa" font-size="17" font-weight="700">OPERATE</text><text x="88" y="66" fill="#9fb0c0" font-size="13">monitor · audit · iterate</text></g>
    </g>
  </g>
</svg>